<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ملفات المشروع</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#10202f;--mut:#5b6b7b;--line:#d5dce3;--bg:#eef1f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 18px}header small{opacity:.7;display:block}header h1{margin:2px 0 0;font-size:24px}
main{max-width:720px;margin:0 auto;padding:16px}section{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
h2{margin:0;padding:12px 16px;font-size:15px;background:#f7f9fb;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row:active,.row:hover{background:#f3f7fb}.ic{font-size:22px;position:relative;width:56px;height:56px;border-radius:10px;background:#eef2f6;display:grid;place-items:center;flex:none;overflow:hidden}.ic .th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.nm{flex:1;word-break:break-word}.sz{color:var(--mut);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:700;font-size:17px;min-height:72px}
.tile:hover,.tile:active{border-color:var(--ink)}.tile b{background:var(--ink);color:#fff;border-radius:99px;min-width:28px;padding:2px 9px;text-align:center;font-size:14px}
.back{display:inline-block;margin:0 0 10px;color:var(--ink);font-weight:600;text-decoration:none}.sh{margin:0 0 12px;font-size:19px}
.row[data-id]{cursor:pointer}
#viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
#viewer .vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#10202f;color:#fff}
#viewer .vn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#viewer .vx{flex:none;border:0;border-radius:10px;background:#fff;color:#10202f;font:700 15px inherit;font-family:inherit;padding:10px 16px;cursor:pointer}
#viewer .vbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#viewer iframe{width:100%;height:100%;border:0;background:#fff}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
.msg{text-align:center;color:var(--mut);padding:40px 0}
.row.note{align-items:flex-start}.tx{white-space:pre-wrap;color:#3d4c5b}
</style>
</head>
<body>
<header><small id="site">&nbsp;</small><h1 id="title">…</h1></header>
<main id="main"></main>
<script src="config.js"></script>
<script src="share.js"></script>
</body>
</html>
